<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Pretendard"; src: url("{{ fonts_uri }}/Pretendard-Regular.otf") format("opentype"); font-weight: 400; }
@font-face { font-family: "Pretendard"; src: url("{{ fonts_uri }}/Pretendard-Bold.otf") format("opentype"); font-weight: 700; }

:root {
  --bg: {{ theme.bg }};
  --ink: {{ theme.ink }};
  --accent: {{ theme.accent }};
  --muted: {{ theme.muted }};
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard", "Pretendard", "Inter", "Noto Sans KR", sans-serif;
  word-break: keep-all;
  -webkit-font-smoothing: antialiased;
}
.slide {
  position: relative;
  width: 1080px; height: 1350px;
  padding: 96px 96px 88px;
  display: flex; flex-direction: column;
}
.header {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 24px; letter-spacing: .08em; color: var(--muted);
  padding-bottom: 24px; border-bottom: 1.5px solid var(--ink);
}
.header .series { color: var(--ink); font-weight: 700; }
.body { min-height: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; }
.footer {
  min-height: 72px;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; flex-shrink: 0;
  padding-top: 24px; border-top: 1px solid var(--muted);
  font-size: 20px; line-height: 1.5; color: var(--muted);
}
.footer .source { max-width: 900px; }

h1 { font-size: 84px; line-height: 1.18; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 44px; }
.body-text { font-size: 34px; line-height: 1.65; white-space: pre-line; }
.body-text.compact { font-size: 32px; }
.body-text.compact-small { font-size: 30px; }
.photo { margin-bottom: 32px; flex-shrink: 0; }
.photo img { display: block; width: 100%; height: 480px; object-fit: cover; }
.accent { color: var(--accent); }
</style>
</head>
<body>
<div class="slide">
  <div class="header">
    <span class="series">{{ series }} {{ '%02d' % post_number }}</span>
    <span>{{ index }} / {{ total }}</span>
  </div>

  <main class="body">
    {% block content %}{% endblock %}
  </main>

  <div class="footer">
    {% if slide.note %}<div class="note">{{ slide.note }}</div>{% endif %}
    <div class="source">{% if slide.source %}출처: {{ slide.source }}{% endif %}</div>
  </div>
</div>
</body>
</html>
