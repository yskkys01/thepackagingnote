<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Pretendard"; src: url("../../fonts/Pretendard-Regular.otf") format("opentype"); font-weight: 400; }
@font-face { font-family: "Pretendard"; src: url("../../fonts/Pretendard-Bold.otf") format("opentype"); font-weight: 700; }

:root {
  --bg: #F7F6F3;
  --ink: #1A1A1A;
  --accent: #2F5D8C;
  --muted: #8A8A8A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard", "Pretendard", "Inter", "Noto Sans KR", sans-serif;
  word-break: keep-all;
  -webkit-font-smoothing: antialiased;
}
.slide {
  position: relative;
  width: 1080px; height: 1350px;
  padding: 96px 96px 88px;
  display: flex; flex-direction: column;
}
.header {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 24px; letter-spacing: .08em; color: var(--muted);
  padding-bottom: 24px; border-bottom: 1.5px solid var(--ink);
}
.header .series { color: var(--ink); font-weight: 700; }
.body { min-height: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; }
.footer {
  min-height: 72px;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; flex-shrink: 0;
  padding-top: 24px; border-top: 1px solid var(--muted);
  font-size: 20px; line-height: 1.5; color: var(--muted);
}
.footer .source { max-width: 900px; }

h1 { font-size: 84px; line-height: 1.18; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 44px; }
.body-text { font-size: 34px; line-height: 1.65; white-space: pre-line; }
.body-text.compact { font-size: 32px; }
.body-text.compact-small { font-size: 30px; }
.photo { margin-bottom: 32px; flex-shrink: 0; }
.photo-frame { width: 100%; display: flex; justify-content: center; background: #EEEDE9; }
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
.photo-media { display: block; width: 100%; height: 100%; }
.photo figcaption { margin-top: 10px; font-size: 18px; line-height: 1.35; letter-spacing: .015em; color: var(--muted); }
.has-photo { padding: 28px 0 24px; }
.has-photo h1 { font-size: 64px; margin-bottom: 24px; }
.has-photo .body-text { line-height: 1.45; }
.has-photo .photo { margin-bottom: 24px; }
.image-credit { font-size: 18px; line-height: 1.4; }
.image-credit a { color: inherit; text-decoration: none; }
.accent { color: var(--accent); }
</style>
</head>
<body>
<div class="slide">
  <div class="header">
    <span class="series">PACKAGING NOTE 02</span>
    <span>1 / 13</span>
  </div>

  <main class="body has-photo">

<h1 class="cover-title">2.5D 패키징</h1>
<div class="rule"></div>
<p class="subtitle">왜 2.5D라고 부를까? 인터포저와 패키지 기판의 역할</p>

<figure class="photo">
  <div class="photo-frame" style="height: 360px;">

    <img src="../../assets/photos/h100-sxm5.jpg" alt="NVIDIA H100 SXM5 module with exposed GPU package" style="object-fit: contain;">

  </div>
<figcaption>NVIDIA H100 · SXM5 module</figcaption>
</figure>


<style>
.cover-title { font-size: 136px; line-height: 1.1; letter-spacing: -0.03em; margin-bottom: 64px; }
.rule { width: 120px; height: 6px; background: var(--accent); margin-bottom: 56px; }
.subtitle { font-size: 44px; line-height: 1.5; color: var(--accent); font-weight: 700; }
.has-photo .cover-title { font-size: 112px; margin-bottom: 32px; }
.has-photo .rule { margin-bottom: 28px; }
.has-photo .subtitle { font-size: 40px; margin-bottom: 40px; }
.has-photo .photo { margin-bottom: 0; }
</style>

  </main>

  <div class="footer">
<div class="image-credit">Image: NVIDIA</div>

    <div class="source"></div>
  </div>
</div>
</body>
</html>
