<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Pretendard"; src: url("../../fonts/Pretendard-Regular.otf") format("opentype"); font-weight: 400; }
@font-face { font-family: "Pretendard"; src: url("../../fonts/Pretendard-Bold.otf") format("opentype"); font-weight: 700; }

:root {
  --bg: #F7F6F3;
  --ink: #1A1A1A;
  --accent: #2F5D8C;
  --muted: #8A8A8A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard", "Pretendard", "Inter", "Noto Sans KR", sans-serif;
  word-break: keep-all;
  -webkit-font-smoothing: antialiased;
}
.slide {
  position: relative;
  width: 1080px; height: 1350px;
  padding: 96px 96px 88px;
  display: flex; flex-direction: column;
}
.header {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 24px; letter-spacing: .08em; color: var(--muted);
  padding-bottom: 24px; border-bottom: 1.5px solid var(--ink);
}
.header .series { color: var(--ink); font-weight: 700; }
.body { min-height: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; }
.footer {
  min-height: 72px;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; flex-shrink: 0;
  padding-top: 24px; border-top: 1px solid var(--muted);
  font-size: 20px; line-height: 1.5; color: var(--muted);
}
.footer .source { max-width: 900px; }

h1 { font-size: 84px; line-height: 1.18; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 44px; }
.body-text { font-size: 34px; line-height: 1.65; white-space: pre-line; }
.body-text.compact { font-size: 32px; }
.body-text.compact-small { font-size: 30px; }
.photo { margin-bottom: 32px; flex-shrink: 0; }
.photo-frame { width: 100%; display: flex; justify-content: center; background: #EEEDE9; }
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
.photo-media { display: block; width: 100%; height: 100%; }
.photo figcaption { margin-top: 10px; font-size: 18px; line-height: 1.35; letter-spacing: .015em; color: var(--muted); }
.has-photo { padding: 28px 0 24px; }
.has-photo h1 { font-size: 64px; margin-bottom: 24px; }
.has-photo .body-text { line-height: 1.45; }
.has-photo .photo { margin-bottom: 24px; }
.image-credit { font-size: 18px; line-height: 1.4; }
.image-credit a { color: inherit; text-decoration: none; }
.accent { color: var(--accent); }
</style>
</head>
<body>
<div class="slide">
  <div class="header">
    <span class="series">PACKAGING NOTE 02</span>
    <span>3 / 13</span>
  </div>

  <main class="body">

<h1>인터포저 위에 칩을 나란히 배치한다</h1>

      <rect x="673" y="386" width="14" height="14"/>
    </g>
    <rect x="230" y="270" width="260" height="116" fill="#2F5D8C" stroke="#1A1A1A" stroke-width="2"/>
    <g fill="#DCE4EE" stroke="#1A1A1A" stroke-width="1.5">
      <rect x="580" y="274" width="140" height="20"/><rect x="580" y="300" width="140" height="20"/>
      <rect x="580" y="326" width="140" height="20"/><rect x="580" y="352" width="140" height="20"/>
      <rect x="580" y="378" width="140" height="20"/>
    </g>
    <line class="tsv" x1="600" y1="270" x2="600" y2="398"/>
    <line class="tsv" x1="640" y1="270" x2="640" y2="398"/>
    <line class="tsv" x1="680" y1="270" x2="680" y2="398"/>
    <text class="label" x="360" y="255" text-anchor="middle">로직 다이</text>
    <text class="label" x="650" y="255" text-anchor="middle">HBM 스택 (TSV로 적층 연결)</text>
    <text class="label" x="100" y="399" text-anchor="end">마이크로범프</text>
    <line class="leader" x1="104" y1="392" x2="262" y2="392"/>
    <text class="label" x="100" y="437" text-anchor="end">실리콘 인터포저</text>
    <line class="leader" x1="104" y1="430" x2="180" y2="430"/>
    <text class="label" x="100" y="472" text-anchor="end">C4 범프</text>
    <line class="leader" x1="104" y1="465" x2="200" y2="465"/>
    <text class="label" x="100" y="507" text-anchor="end">패키지 기판</text>
    <line class="leader" x1="104" y1="500" x2="120" y2="500"/>
    <line class="leader" x1="771" y1="545" x2="785" y2="545"/>
    <text class="label" x="790" y="552">솔더 볼 (PCB 연결)</text>
  </g>
</svg></div>
<p class="caption">GPU와 HBM을 하나의 인터포저 위에 놓고, 패키지 기판이 메인보드와 이어 줍니다.

칩 → 인터포저 → 패키지 기판 → 메인보드</p>

<style>
.diagram { width: 100%; margin: 8px 0 48px; }
.diagram svg { width: 100%; height: auto; display: block; }
.caption { font-size: 32px; line-height: 1.65; white-space: pre-line; color: var(--ink); }
</style>

  </main>

  <div class="footer">

<div class="note">실리콘 인터포저를 사용하는 대표적인 구조를 기준으로 설명합니다.</div>
    <div class="source"></div>
  </div>
</div>
</body>
</html>
