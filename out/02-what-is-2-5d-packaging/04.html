<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Pretendard"; src: url("../../fonts/Pretendard-Regular.otf") format("opentype"); font-weight: 400; }
@font-face { font-family: "Pretendard"; src: url("../../fonts/Pretendard-Bold.otf") format("opentype"); font-weight: 700; }

:root {
  --bg: #F7F6F3;
  --ink: #1A1A1A;
  --accent: #2F5D8C;
  --muted: #8A8A8A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard", "Pretendard", "Inter", "Noto Sans KR", sans-serif;
  word-break: keep-all;
  -webkit-font-smoothing: antialiased;
}
.slide {
  position: relative;
  width: 1080px; height: 1350px;
  padding: 96px 96px 88px;
  display: flex; flex-direction: column;
}
.header {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 24px; letter-spacing: .08em; color: var(--muted);
  padding-bottom: 24px; border-bottom: 1.5px solid var(--ink);
}
.header .series { color: var(--ink); font-weight: 700; }
.body { min-height: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; }
.footer {
  min-height: 72px;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; flex-shrink: 0;
  padding-top: 24px; border-top: 1px solid var(--muted);
  font-size: 20px; line-height: 1.5; color: var(--muted);
}
.footer .source { max-width: 900px; }

h1 { font-size: 84px; line-height: 1.18; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 44px; }
.body-text { font-size: 34px; line-height: 1.65; white-space: pre-line; }
.body-text.compact { font-size: 32px; }
.body-text.compact-small { font-size: 30px; }
.photo { margin-bottom: 32px; flex-shrink: 0; }
.photo img { display: block; width: 100%; height: 480px; object-fit: cover; }
.accent { color: var(--accent); }
</style>
</head>
<body>
<div class="slide">
  <div class="header">
    <span class="series">PACKAGING NOTE 02</span>
    <span>4 / 13</span>
  </div>

  <main class="body">
    

<h1>칩의 배치와 연결 방식에 따른 구분</h1>

<div class="table" style="grid-template-columns: 240px repeat(1, 1fr);">
  <div class="cell head"></div>
  <div class="cell head">설명</div>

  
    <div class="cell item">2D</div>
    <div class="cell">칩들을 나란히 배치하고, 주로 패키지 기판의 배선으로 연결합니다.</div>
  
    <div class="cell item">2.5D</div>
    <div class="cell">칩들을 나란히 배치하되, 인터포저 등의 고밀도 연결 구조를 사용합니다.</div>
  
    <div class="cell item">3D</div>
    <div class="cell">칩들을 위아래로 쌓고, 층 사이에 수직 연결을 형성합니다.</div>
  
</div>

<style>
.table { display: grid; border-top: 2px solid var(--ink); }
.cell {
  padding: 36px 20px;
  font-size: 32px; line-height: 1.5;
  border-bottom: 1.5px solid var(--muted);
}
.cell.head { font-weight: 700; color: var(--accent); font-size: 36px; }
.cell.item { font-weight: 700; }
</style>

  </main>

  <div class="footer">
    <div class="note">2.5D라는 이름은 구조적 특징을 나타냅니다. 인터포저가 한 층 추가돼서 ‘0.5차원’이 더해진다는 뜻은 아닙니다.</div>
    <div class="source"></div>
  </div>
</div>
</body>
</html>
