<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Pretendard"; src: url("../../fonts/Pretendard-Regular.otf") format("opentype"); font-weight: 400; }
@font-face { font-family: "Pretendard"; src: url("../../fonts/Pretendard-Bold.otf") format("opentype"); font-weight: 700; }

:root {
  --bg: #F7F6F3;
  --ink: #1A1A1A;
  --accent: #2F5D8C;
  --muted: #8A8A8A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard", "Pretendard", "Inter", "Noto Sans KR", sans-serif;
  word-break: keep-all;
  -webkit-font-smoothing: antialiased;
}
.slide {
  position: relative;
  width: 1080px; height: 1350px;
  padding: 96px 96px 88px;
  display: flex; flex-direction: column;
}
.header {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 24px; letter-spacing: .08em; color: var(--muted);
  padding-bottom: 24px; border-bottom: 1.5px solid var(--ink);
}
.header .series { color: var(--ink); font-weight: 700; }
.body { min-height: 0; flex: 1; display: flex; flex-direction: column; justify-content: center; }
.footer {
  min-height: 72px;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; flex-shrink: 0;
  padding-top: 24px; border-top: 1px solid var(--muted);
  font-size: 20px; line-height: 1.5; color: var(--muted);
}
.footer .source { max-width: 900px; }

h1 { font-size: 84px; line-height: 1.18; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 44px; }
.body-text { font-size: 34px; line-height: 1.65; white-space: pre-line; }
.body-text.compact { font-size: 32px; }
.body-text.compact-small { font-size: 30px; }
.photo { margin-bottom: 32px; flex-shrink: 0; }
.photo-frame { width: 100%; display: flex; justify-content: center; background: #EEEDE9; }
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
.photo-media { display: block; width: 100%; height: 100%; }
.photo figcaption { margin-top: 10px; font-size: 18px; line-height: 1.35; letter-spacing: .015em; color: var(--muted); }
.has-photo { padding: 28px 0 24px; }
.has-photo h1 { font-size: 64px; margin-bottom: 24px; }
.has-photo .body-text { line-height: 1.45; }
.has-photo .photo { margin-bottom: 24px; }
.image-credit { font-size: 18px; line-height: 1.4; }
.image-credit a { color: inherit; text-decoration: none; }
.accent { color: var(--accent); }
.layout-text .photo-frame { height: 380px !important; }
.slide-10 .photo-frame { height: 300px !important; }
.slide-9 .photo-frame { height: 260px !important; }
/* Editorial system: fixed opening baseline, quiet furniture, photographic plates. */
.slide { padding: 64px 80px 56px; }
.header { font-size: 18px; letter-spacing: .16em; padding-bottom: 20px; border-bottom: 1px solid #C9C8C3; }
.header .series::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 14px; background: var(--accent); }
.body { justify-content: flex-start; padding: 76px 0 40px; }
h1 { font-size: 78px; letter-spacing: -.045em; line-height: 1.16; margin-bottom: 56px; max-width: 880px; }
.body-text { line-height: 1.65; }
.footer { min-height: 62px; font-size: 17px; line-height: 1.45; border-color: #D6D4CE; padding-top: 18px; }
.image-credit { font-size: 16px; }
.has-photo { padding-top: 44px; padding-bottom: 30px; }
.has-photo h1 { font-size: 64px; margin-bottom: 30px; }
.has-photo .body-text { line-height: 1.45; }
.photo { display: grid; grid-template-columns: 60% 1fr; align-items: center; gap: 32px; }
.photo-frame { background: transparent; }
.photo figcaption { margin: 0; padding: 20px 0 20px 22px; border-left: 2px solid var(--accent); color: var(--accent); font-size: 20px; line-height: 1.5; max-width: 260px; }
.layout-cover { background: #162C40; color: #F7F6F3; }
.layout-cover .header, .layout-cover .footer { border-color: #526372; color: #ADB9C3; }
.layout-cover .header .series { color: #F7F6F3; }
.layout-cover .header .series::before { background: #91B6DA; }
.layout-cover .body { padding-top: 90px; }
.layout-cover .has-photo .cover-title { font-size: 132px; margin-bottom: 30px; max-width: 850px; }
.layout-cover .rule { background: #91B6DA; }
.layout-cover .has-photo .subtitle { color: #B7D1EA; font-size: 38px; line-height: 1.4; max-width: 780px; margin-bottom: 56px; }
.layout-cover .photo { display: block; }
.layout-cover .photo-frame { background: white; padding: 20px; height: 400px !important; }
.layout-cover .photo figcaption { border: 0; padding: 14px 0 0; max-width: none; color: #ADB9C3; font-size: 18px; }
.layout-closing .body { justify-content: center; }
.layout-closing h1 { color: var(--accent); }
.layout-closing .cta { background: var(--accent); color: #fff; border: 0; padding: 26px 34px; font-size: 30px; }
.layout-diagram .body { padding-top: 40px; }
.layout-diagram h1 { font-size: 70px; margin-bottom: 12px; }
.layout-diagram .diagram { margin-bottom: 24px; }
.layout-comparison .cell { padding: 30px 20px; }
.layout-comparison .cell.head { background: var(--accent); color: white; border: 0; }
.layout-comparison .cell.item { color: var(--accent); }
/* Image and type share the same reading field. */
.layout-text .composition { display: flow-root; }
.layout-text .body-text { white-space: normal; }
.layout-text .body-text p { margin: 0 0 30px; }
.layout-text .photo { display: block; float: right; width: 420px; margin: 80px -10px 24px 32px; shape-outside: inset(55px 0 0 0 round 36px); }
.layout-text .photo-frame { height: 340px !important; background: transparent; }
.layout-text .photo figcaption { font-size: 15px; line-height: 1.4; border: 0; padding: 8px 10px; max-width: none; color: var(--muted); }
.layout-text .has-photo h1 { font-size: 65px; line-height: 1.12; margin-bottom: 38px; }
.layout-text .has-photo .body-text { line-height: 1.5; }
.layout-text .photo-media { mix-blend-mode: multiply; }
.slide-5 .photo img, .slide-9 .photo img { mix-blend-mode: multiply; }
.slide-11 .photo { width: 500px; margin-top: 90px; margin-right: -55px; shape-outside: polygon(30% 0,100% 0,100% 100%,0 100%,0 40%); }
.slide-11 .photo-frame { height: 410px !important; transform: rotate(-8deg); }
.slide-10 .photo { width: 350px; margin-top: 70px; }
.slide-10 .photo-frame { height: 300px !important; }
.layout-cover .body { position: relative; display: block; padding-top: 100px; }
.layout-cover .has-photo .cover-title { position: relative; z-index: 3; font-size: 164px; line-height: .98; max-width: 720px; letter-spacing: -.06em; }
.layout-cover .rule { display: none; }
.layout-cover .has-photo .subtitle { position: absolute; bottom: 45px; left: 0; width: 720px; font-size: 38px; margin: 0; }
.layout-cover .photo { position: absolute; top: 350px; left: -45px; width: 1010px; transform: rotate(-12deg); z-index: 2; }
.layout-cover .photo-frame { background: transparent; height: 510px !important; padding: 0; }
.layout-cover .photo figcaption { transform: rotate(12deg); padding-left: 120px; }
.layout-cover .photo img { filter: drop-shadow(0 30px 30px #0005); }
.slide-5 .photo img, .slide-8 .photo-media, .slide-10 .photo-media, .slide-12 .photo-media {
  mask-image: linear-gradient(to top, #000 0 12%, transparent 12%), linear-gradient(to right, transparent, #000 4% 96%, transparent);
}
.layout-cover .photo figcaption { position: absolute; top: 540px; left: 80px; padding: 0; }
</style>
</head>
<body class="layout-text slide-5">
<div class="slide">
  <div class="header">
    <span class="series">PACKAGING NOTE 02</span>
    <span>5 / 13</span>
  </div>

  <main class="body has-photo">

<div class="composition">

<figure class="photo">
  <div class="photo-frame" style="height: 280px;">

    <img src="../../assets/photos/tsv-interposer.jpg" alt="Philtech silicon interposer cross-sectional SEM showing TSV electrodes" style="object-fit: contain;">

  </div>
<figcaption>Silicon interposer · TSV cross-section SEM</figcaption>
</figure>

<h1>칩 사이에 미세한 배선을 형성한다</h1>
<div class="body-text"><p>인터포저는 칩과 패키지 기판 사이에 들어가는 연결 구조입니다.</p><p>실리콘 인터포저에는 반도체 공정을 이용해 미세한 금속 배선을 만들 수 있습니다. 이 배선을 통해 칩의 접속점을 다른 칩이나 아래쪽 기판으로 연결합니다.</p><p>GPU와 HBM처럼 많은 신호를 동시에 주고받는 칩들을 연결할 때 사용됩니다.</p></div>
</div>

  </main>

  <div class="footer">
<div class="image-credit">Image: Philtech</div>

    <div class="source"></div>
  </div>
</div>
</body>
</html>
